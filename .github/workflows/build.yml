name: Build Kokoro TTS Michael APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.1.13356709"
          yes | sdkmanager --licenses || true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked

      # ============================================================
      # DOWNLOAD OFFICIAL KOKORO V1.0 INT8 MODEL
      # ============================================================

      - name: Download official Kokoro INT8 model
        run: |
          mkdir -p "$RUNNER_TEMP/kokoro"

          curl -L --fail --retry 5 \
            -o "$RUNNER_TEMP/kokoro/kokoro.onnx" \
            "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/onnx/model_quantized.onnx?download=true"

          ls -lh "$RUNNER_TEMP/kokoro/kokoro.onnx"

          test -s "$RUNNER_TEMP/kokoro/kokoro.onnx"

      # ============================================================
      # DOWNLOAD ONLY MICHAEL VOICE
      # ============================================================

      - name: Download am_michael voice
        run: |
          curl -L --fail --retry 5 \
            -o "$RUNNER_TEMP/kokoro/am_michael.bin" \
            "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/am_michael.bin?download=true"

          ls -lh "$RUNNER_TEMP/kokoro/am_michael.bin"

          test -s "$RUNNER_TEMP/kokoro/am_michael.bin"

      # ============================================================
      # CREATE RUST JNI PROJECT
      # ============================================================

      - name: Create Rust JNI project
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kokoro-rust/src"

          cat > "$RUNNER_TEMP/kokoro-rust/Cargo.toml" <<'EOF'
          [package]
          name = "kokoro_jni"
          version = "1.0.0"
          edition = "2024"

          [lib]
          crate-type = ["cdylib"]

          [dependencies]
          jni = "0.21.1"
          tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
          kokoro-en = "=0.1.5"
          EOF

          cat > "$RUNNER_TEMP/kokoro-rust/src/lib.rs" <<'EOF'
          use jni::objects::{JByteArray, JClass, JString};
          use jni::sys::{jbyteArray, jfloat, jint};
          use jni::JNIEnv;

          use kokoro_en::{KokoroTts, Voice};

          use std::sync::{Mutex, OnceLock};

          static ENGINE: OnceLock<Mutex<Option<KokoroTts>>> = OnceLock::new();

          fn engine_storage() -> &'static Mutex<Option<KokoroTts>> {
              ENGINE.get_or_init(|| Mutex::new(None))
          }

          fn make_runtime() -> Result<tokio::runtime::Runtime, String> {
              tokio::runtime::Builder::new_multi_thread()
                  .enable_all()
                  .build()
                  .map_err(|e| format!("Tokio runtime creation failed: {e}"))
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_vishala_kokoromichael_KokoroEngine_nativeInit(
              mut env: JNIEnv,
              _class: JClass,
              model_path: JString,
              voice_path: JString,
          ) -> jint {
              let model_path: String = match env.get_string(&model_path) {
                  Ok(v) => v.into(),
                  Err(_) => return -1,
              };

              let voice_path: String = match env.get_string(&voice_path) {
                  Ok(v) => v.into(),
                  Err(_) => return -2,
              };

              let runtime = match make_runtime() {
                  Ok(v) => v,
                  Err(_) => return -3,
              };

              let result = runtime.block_on(async {
                  KokoroTts::new(
                      model_path.as_str(),
                      voice_path.as_str(),
                  )
                  .await
              });

              match result {
                  Ok(tts) => {
                      let storage = engine_storage();

                      match storage.lock() {
                          Ok(mut guard) => {
                              *guard = Some(tts);
                              0
                          }
                          Err(_) => -4,
                      }
                  }

                  Err(error) => {
                      eprintln!("Kokoro initialization failed: {error}");
                      -5
                  }
              }
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_vishala_kokoromichael_KokoroEngine_nativeSynthesize(
              mut env: JNIEnv,
              _class: JClass,
              text: JString,
              speed: jfloat,
          ) -> jbyteArray {
              let text: String = match env.get_string(&text) {
                  Ok(v) => v.into(),
                  Err(_) => return std::ptr::null_mut(),
              };

              let speed = speed.clamp(0.5, 2.0);

              let runtime = match make_runtime() {
                  Ok(v) => v,
                  Err(error) => {
                      eprintln!("Runtime creation failed: {error}");
                      return std::ptr::null_mut();
                  }
              };

              let result = runtime.block_on(async {
                  let storage = engine_storage();

                  let guard = storage
                      .lock()
                      .map_err(|_| "Engine lock failed".to_string())?;

                  let tts = guard
                      .as_ref()
                      .ok_or_else(|| "Kokoro engine is not initialized".to_string())?;

                  let voice = Voice::new("am_michael")
                      .with_speed(speed);

                  let (audio, _) = tts
                      .synth(&text, voice)
                      .await
                      .map_err(|e| format!("Kokoro synthesis failed: {e}"))?;

                  Ok::<Vec<f32>, String>(audio)
              });

              let audio = match result {
                  Ok(v) => v,
                  Err(error) => {
                      eprintln!("{error}");
                      return std::ptr::null_mut();
                  }
              };

              let mut pcm = Vec::<u8>::with_capacity(audio.len() * 2);

              for sample in audio {
                  let sample = sample.clamp(-1.0, 1.0);

                  let value = if sample >= 0.0 {
                      (sample * 32767.0) as i16
                  } else {
                      (sample * 32768.0) as i16
                  };

                  pcm.extend_from_slice(&value.to_le_bytes());
              }

              match env.byte_array_from_slice(&pcm) {
                  Ok(array) => array.into_raw(),
                  Err(error) => {
                      eprintln!("JNI byte array creation failed: {error}");
                      std::ptr::null_mut()
                  }
              }
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_vishala_kokoromichael_KokoroEngine_nativeRelease(
              _env: JNIEnv,
              _class: JClass,
          ) {
              if let Ok(mut guard) = engine_storage().lock() {
                  *guard = None;
              }
          }
          EOF

      # ============================================================
      # BUILD RUST FOR ARM64 ANDROID
      # ============================================================

      - name: Build Rust JNI library
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a

          cd "$RUNNER_TEMP/kokoro-rust"

          cargo ndk \
            -t arm64-v8a \
            --platform 29 \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs" \
            build --release

      # ============================================================
      # COPY C++ RUNTIME
      # ============================================================

      - name: Add libc++ shared runtime
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a

          cp \
            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
            "app/src/main/jniLibs/arm64-v8a/libc++_shared.so"

          test -f app/src/main/jniLibs/arm64-v8a/libc++_shared.so

          echo "Native libraries:"
          ls -lh app/src/main/jniLibs/arm64-v8a/

      # ============================================================
      # COPY MODEL + MICHAEL VOICE INTO APK ASSETS
      # ============================================================

      - name: Copy Kokoro assets
        run: |
          mkdir -p app/src/main/assets/kokoro

          cp \
            "$RUNNER_TEMP/kokoro/kokoro.onnx" \
            app/src/main/assets/kokoro/kokoro.onnx

          cp \
            "$RUNNER_TEMP/kokoro/am_michael.bin" \
            app/src/main/assets/kokoro/am_michael.bin

          echo "APK Kokoro assets:"
          ls -lh app/src/main/assets/kokoro/

      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build release APK
        run: |
          ./gradlew --no-daemon --stacktrace assembleRelease

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kokoro-TTS-Michael-Offline
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
