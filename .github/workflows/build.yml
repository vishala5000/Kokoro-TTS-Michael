name: Build Kokoro TTS Michael APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # GRADLE 8.13
      #
      # IMPORTANT:
      # This project does NOT need gradlew.
      # We use the Gradle installed by setup-gradle.
      # ============================================================

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # ANDROID SDK COMPONENTS
      # ============================================================

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.3.13750724"


      # ============================================================
      # CONFIGURE NDK
      # ============================================================

      - name: Configure Android NDK
        shell: bash
        run: |
          set -e

          NDK_DIR="$ANDROID_SDK_ROOT/ndk/27.3.13750724"

          if [ ! -d "$NDK_DIR" ]; then
            echo "ERROR: NDK directory not found:"
            echo "$NDK_DIR"
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

          echo "NDK:"
          "$NDK_DIR/ndk-build" --version || true


      # ============================================================
      # RUST
      # ============================================================

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android


      # ============================================================
      # CARGO-NDK
      # ============================================================

      - name: Install cargo-ndk
        shell: bash
        run: |
          set -e

          cargo install cargo-ndk --locked

          cargo ndk --version


      # ============================================================
      # VERIFY TOOLS
      # ============================================================

      - name: Verify build environment
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "JAVA"
          echo "========================================"
          java -version

          echo ""
          echo "========================================"
          echo "GRADLE"
          echo "========================================"
          gradle --version

          echo ""
          echo "========================================"
          echo "RUST"
          echo "========================================"
          rustc --version
          cargo --version

          echo ""
          echo "========================================"
          echo "ANDROID"
          echo "========================================"
          adb --version

          echo ""
          echo "========================================"
          echo "PROJECT"
          echo "========================================"
          ls -la

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -d app

          echo ""
          echo "Gradle Android project detected."


      # ============================================================
      # CREATE TEMP DIRECTORY
      # ============================================================

      - name: Prepare Kokoro build directory
        shell: bash
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/kokoro"

          echo "Kokoro temporary directory:"
          echo "$RUNNER_TEMP/kokoro"


      # ============================================================
      # DOWNLOAD OFFICIAL KOKORO MODEL
      #
      # Official ONNX Community repository:
      #
      # onnx-community/Kokoro-82M-v1.0-ONNX
      #
      # INT8 model:
      # model_quantized.onnx
      # ============================================================

      - name: Download official Kokoro INT8 model
        shell: bash
        run: |
          set -e

          MODEL_DIR="$RUNNER_TEMP/kokoro"
          MODEL="$MODEL_DIR/kokoro.onnx"

          echo "Downloading official Kokoro INT8 model..."

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/onnx/model_quantized.onnx?download=true" \
            --output "$MODEL"

          if [ ! -f "$MODEL" ]; then
            echo "ERROR: Kokoro model was not downloaded."
            exit 1
          fi

          MODEL_SIZE=$(stat -c%s "$MODEL")

          echo "Model size:"
          echo "$MODEL_SIZE bytes"

          if [ "$MODEL_SIZE" -lt 50000000 ]; then
            echo "ERROR: Model file is suspiciously small."
            exit 1
          fi

          echo "Official Kokoro INT8 model downloaded successfully."


      # ============================================================
      # DOWNLOAD MICHAEL VOICE
      #
      # American Male — Michael
      # ============================================================

      - name: Download official Michael voice
        shell: bash
        run: |
          set -e

          MODEL_DIR="$RUNNER_TEMP/kokoro"
          VOICE="$MODEL_DIR/am_michael.bin"

          echo "Downloading official am_michael voice..."

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 600 \
            "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/am_michael.bin?download=true" \
            --output "$VOICE"

          if [ ! -f "$VOICE" ]; then
            echo "ERROR: Michael voice was not downloaded."
            exit 1
          fi

          VOICE_SIZE=$(stat -c%s "$VOICE")

          echo "Voice size:"
          echo "$VOICE_SIZE bytes"

          if [ "$VOICE_SIZE" -lt 100000 ]; then
            echo "ERROR: Voice file is suspiciously small."
            exit 1
          fi

          echo "Official am_michael voice downloaded successfully."


      # ============================================================
      # CREATE RUST JNI PROJECT
      # ============================================================

      - name: Create Rust JNI project
        shell: bash
        run: |
          set -e

          RUST_DIR="$RUNNER_TEMP/kokoro-rust"

          rm -rf "$RUST_DIR"

          mkdir -p "$RUST_DIR/src"

          cat > "$RUST_DIR/Cargo.toml" <<'EOF'
          [package]
          name = "kokoro_jni"
          version = "1.0.0"
          edition = "2024"

          [lib]
          crate-type = ["cdylib"]

          [dependencies]
          jni = "0.21.1"
          tokio = { version = "1", features = ["rt", "macros"] }
          kokoro-en = "=0.1.5"
          EOF

          cat > "$RUST_DIR/src/lib.rs" <<'EOF'
          use std::sync::Mutex;

          use jni::objects::{JByteArray, JClass, JString};
          use jni::sys::{jbyteArray, jint, jfloat};
          use jni::JNIEnv;

          use kokoro_en::{KokoroTts, Voice};

          static ENGINE: Mutex<Option<KokoroTts>> = Mutex::new(None);

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_vishala_kokoromichael_KokoroEngine_nativeInit(
              mut env: JNIEnv,
              _class: JClass,
              model_path: JString,
              voice_path: JString,
          ) -> jint {
              let model_path: String = match env.get_string(&model_path) {
                  Ok(value) => value.into(),
                  Err(_) => return 1,
              };

              let voice_path: String = match env.get_string(&voice_path) {
                  Ok(value) => value.into(),
                  Err(_) => return 2,
              };

              let runtime = match tokio::runtime::Builder::new_current_thread()
                  .enable_all()
                  .build()
              {
                  Ok(value) => value,
                  Err(_) => return 3,
              };

              let result = runtime.block_on(async {
                  KokoroTts::new(&model_path, &voice_path).await
              });

              match result {
                  Ok(tts) => {
                      let mut engine = match ENGINE.lock() {
                          Ok(value) => value,
                          Err(_) => return 4,
                      };

                      *engine = Some(tts);

                      0
                  }

                  Err(_) => 5,
              }
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_vishala_kokoromichael_KokoroEngine_nativeSynthesize(
              mut env: JNIEnv,
              _class: JClass,
              text: JString,
              speed: jfloat,
          ) -> jbyteArray {
              let text: String = match env.get_string(&text) {
                  Ok(value) => value.into(),
                  Err(_) => return std::ptr::null_mut(),
              };

              if text.trim().is_empty() {
                  return std::ptr::null_mut();
              }

              let speed = speed.clamp(0.5, 2.0);

              let mut engine = match ENGINE.lock() {
                  Ok(value) => value,
                  Err(_) => return std::ptr::null_mut(),
              };

              let tts = match engine.as_mut() {
                  Some(value) => value,
                  None => return std::ptr::null_mut(),
              };

              let runtime = match tokio::runtime::Builder::new_current_thread()
                  .enable_all()
                  .build()
              {
                  Ok(value) => value,
                  Err(_) => return std::ptr::null_mut(),
              };

              let result = runtime.block_on(async {
                  let voice = Voice::new("am_michael")
                      .with_speed(speed);

                  tts.synth(&text, voice).await
              });

              let audio = match result {
                  Ok(value) => value,
                  Err(_) => return std::ptr::null_mut(),
              };

              let mut pcm = Vec::<u8>::with_capacity(audio.len() * 2);

              for sample in audio {
                  let sample = sample.clamp(-1.0, 1.0);

                  let value = if sample >= 0.0 {
                      (sample * 32767.0) as i16
                  } else {
                      (sample * 32768.0) as i16
                  };

                  pcm.extend_from_slice(&value.to_le_bytes());
              }

              match env.byte_array_from_slice(&pcm) {
                  Ok(array) => array.into_raw(),
                  Err(_) => std::ptr::null_mut(),
              }
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_vishala_kokoromichael_KokoroEngine_nativeRelease(
              _env: JNIEnv,
              _class: JClass,
          ) {
              if let Ok(mut engine) = ENGINE.lock() {
                  *engine = None;
              }
          }
          EOF

          echo "Rust JNI project created."


      # ============================================================
      # BUILD RUST LIBRARY
      # ============================================================

      - name: Build Rust Kokoro JNI library
        shell: bash
        working-directory: ${{ runner.temp }}/kokoro-rust
        run: |
          set -e

          echo "========================================"
          echo "BUILDING RUST JNI"
          echo "========================================"

          cargo ndk \
            -t arm64-v8a \
            --platform 29 \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs" \
            build \
            --release

          echo ""
          echo "Native libraries:"
          find "$GITHUB_WORKSPACE/app/src/main/jniLibs" -type f -print


      # ============================================================
      # COPY libc++_shared.so
      #
      # Required by the Rust/ONNX native library.
      # ============================================================

      - name: Add Android C++ runtime
        shell: bash
        run: |
          set -e

          NDK_DIR="$ANDROID_NDK_HOME"

          SOURCE="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"

          DEST_DIR="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"

          mkdir -p "$DEST_DIR"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: libc++_shared.so not found:"
            echo "$SOURCE"
            exit 1
          fi

          cp "$SOURCE" "$DEST_DIR/libc++_shared.so"

          echo "Copied:"
          ls -lh "$DEST_DIR/libc++_shared.so"


      # ============================================================
      # COPY MODEL + VOICE INTO ANDROID ASSETS
      #
      # These files become part of the APK.
      #
      # Therefore the installed application needs NO INTERNET.
      # ============================================================

      - name: Bundle Kokoro model and Michael voice
        shell: bash
        run: |
          set -e

          ASSET_DIR="$GITHUB_WORKSPACE/app/src/main/assets/kokoro"

          mkdir -p "$ASSET_DIR"

          cp \
            "$RUNNER_TEMP/kokoro/kokoro.onnx" \
            "$ASSET_DIR/kokoro.onnx"

          cp \
            "$RUNNER_TEMP/kokoro/am_michael.bin" \
            "$ASSET_DIR/am_michael.bin"

          echo "========================================"
          echo "KOKORO ASSETS"
          echo "========================================"

          ls -lh "$ASSET_DIR"

          test -s "$ASSET_DIR/kokoro.onnx"
          test -s "$ASSET_DIR/am_michael.bin"

          echo ""
          echo "Model and Michael voice are bundled."


      # ============================================================
      # VERIFY ANDROID NATIVE LIBRARIES
      # ============================================================

      - name: Verify native libraries
        shell: bash
        run: |
          set -e

          LIB_DIR="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"

          echo "========================================"
          echo "NATIVE LIBRARIES"
          echo "========================================"

          ls -lh "$LIB_DIR"

          test -s "$LIB_DIR/libkokoro_jni.so"
          test -s "$LIB_DIR/libc++_shared.so"

          echo ""
          echo "Native libraries verified."


      # ============================================================
      # VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ANDROID PROJECT TREE"
          echo "========================================"

          find app/src/main -maxdepth 5 -type f -print | sort

          echo ""
          echo "Checking required files..."

          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/vishala/kokoromichael/MainActivity.kt
          test -f app/src/main/java/com/vishala/kokoromichael/KokoroEngine.kt
          test -f app/src/main/java/com/vishala/kokoromichael/ModelDownloader.kt
          test -f app/src/main/java/com/vishala/kokoromichael/WavWriter.kt
          test -f app/src/main/java/com/vishala/kokoromichael/Settings.kt

          test -f app/src/main/assets/kokoro/kokoro.onnx
          test -f app/src/main/assets/kokoro/am_michael.bin

          test -f app/src/main/jniLibs/arm64-v8a/libkokoro_jni.so
          test -f app/src/main/jniLibs/arm64-v8a/libc++_shared.so

          echo ""
          echo "All required files exist."


      # ============================================================
      # BUILD RELEASE APK
      #
      # IMPORTANT:
      # There is NO ./gradlew here.
      #
      # Gradle 8.13 was installed above, so use:
      #
      # gradle assembleRelease
      # ============================================================

      - name: Build release APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GRADLE VERSION"
          echo "========================================"

          gradle --version

          echo ""
          echo "========================================"
          echo "BUILD RELEASE APK"
          echo "========================================"

          gradle \
            --no-daemon \
            --stacktrace \
            assembleRelease


      # ============================================================
      # FIND APK
      # ============================================================

      - name: Locate APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GENERATED APK FILES"
          echo "========================================"

          find app/build/outputs/apk -type f -name "*.apk" -print

          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # ============================================================
      # COPY APK TO SIMPLE NAME
      # ============================================================

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK_PATH" \
            "$GITHUB_WORKSPACE/output/Kokoro-TTS-Michael.apk"

          ls -lh "$GITHUB_WORKSPACE/output/Kokoro-TTS-Michael.apk"


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kokoro-TTS-Michael
          path: output/Kokoro-TTS-Michael.apk
          if-no-files-found: error
          retention-days: 30
