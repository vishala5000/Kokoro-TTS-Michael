name: Build Kokoro TTS Michael APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.3.13750724"

          echo ""
          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          ls -la "$ANDROID_SDK_ROOT/ndk/27.3.13750724"


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"


      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android


      - name: Install cargo-ndk
        shell: bash
        run: |
          set -e

          cargo install cargo-ndk --locked

          cargo ndk --version


      - name: Download official Kokoro model and Michael voice
        shell: bash
        run: |
          set -e

          KOKORO_DIR="$RUNNER_TEMP/kokoro"

          rm -rf "$KOKORO_DIR"
          mkdir -p "$KOKORO_DIR"

          MODEL_URL="https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/onnx/model_quantized.onnx?download=true"

          VOICE_URL="https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/am_michael.bin?download=true"

          echo "========================================"
          echo "DOWNLOADING KOKORO MODEL"
          echo "========================================"

          curl \
            -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            "$MODEL_URL" \
            -o "$KOKORO_DIR/kokoro.onnx"

          echo ""
          echo "========================================"
          echo "DOWNLOADING MICHAEL VOICE"
          echo "========================================"

          curl \
            -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            "$VOICE_URL" \
            -o "$KOKORO_DIR/am_michael.bin"

          test -s "$KOKORO_DIR/kokoro.onnx"
          test -s "$KOKORO_DIR/am_michael.bin"

          echo ""
          echo "========================================"
          echo "DOWNLOADED KOKORO FILES"
          echo "========================================"

          ls -lh "$KOKORO_DIR"


      - name: Create Rust JNI project
        shell: bash
        run: |
          set -e

          RUST_DIR="$RUNNER_TEMP/kokoro-rust"

          rm -rf "$RUST_DIR"

          mkdir -p "$RUST_DIR/src"

          echo "========================================"
          echo "CREATING RUST PROJECT"
          echo "========================================"


          cat > "$RUST_DIR/Cargo.toml" <<'EOF'
          [package]
          name = "kokoro_jni"
          version = "1.0.0"
          edition = "2024"

          [lib]
          crate-type = ["cdylib"]

          [dependencies]
          jni = "0.21.1"
          tokio = { version = "1", features = ["rt", "macros"] }
          kokoro-en = "=0.1.5"
          EOF


          cat > "$RUST_DIR/kokoro-g2p.tab" <<'EOF'
          youtube	jˈuːtuːb
          youtube.com	jˈuːtuːb dˈɑt kˈɑm
          EOF


          cat > "$RUST_DIR/src/lib.rs" <<'EOF'
          use std::sync::Mutex;

          use jni::objects::{JClass, JString};
          use jni::sys::{jbyteArray, jfloat, jint};
          use jni::JNIEnv;

          use kokoro_en::{KokoroTts, Voice};


          static ENGINE: Mutex<Option<KokoroTts>> =
              Mutex::new(None);


          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_vishala_kokoromichael_KokoroEngine_nativeInit(
              mut env: JNIEnv,
              _class: JClass,
              model_path: JString,
              voice_path: JString,
          ) -> jint {

              let model_path: String =
                  match env.get_string(&model_path) {
                      Ok(value) => value.into(),
                      Err(_) => return 1,
                  };


              let voice_path: String =
                  match env.get_string(&voice_path) {
                      Ok(value) => value.into(),
                      Err(_) => return 2,
                  };


              let lexicon_path =
                  std::path::Path::new(&model_path)
                      .parent()
                      .map(|dir| {
                          dir.join("kokoro-g2p.tab")
                      });


              if let Some(path) = lexicon_path {

                  if path.exists() {

                      unsafe {
                          std::env::set_var(
                              "KOKORO_G2P_LEXICON",
                              path.to_string_lossy().as_ref(),
                          );
                      }
                  }
              }


              let runtime =
                  match tokio::runtime::Builder::new_current_thread()
                      .enable_all()
                      .build()
                  {
                      Ok(value) => value,
                      Err(_) => return 3,
                  };


              let result =
                  runtime.block_on(async {
                      KokoroTts::new(
                          &model_path,
                          &voice_path
                      ).await
                  });


              match result {

                  Ok(tts) => {

                      let mut engine =
                          match ENGINE.lock() {
                              Ok(value) => value,
                              Err(_) => return 4,
                          };


                      *engine = Some(tts);

                      0
                  }


                  Err(_) => 5,
              }
          }


          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_vishala_kokoromichael_KokoroEngine_nativeSynthesize(
              mut env: JNIEnv,
              _class: JClass,
              text: JString,
              speed: jfloat,
          ) -> jbyteArray {

              let text: String =
                  match env.get_string(&text) {

                      Ok(value) => value.into(),

                      Err(_) => {
                          return std::ptr::null_mut();
                      }
                  };


              if text.trim().is_empty() {
                  return std::ptr::null_mut();
              }


              let speed =
                  speed.clamp(
                      0.5,
                      2.0
                  );


              let mut engine =
                  match ENGINE.lock() {

                      Ok(value) => value,

                      Err(_) => {
                          return std::ptr::null_mut();
                      }
                  };


              let tts =
                  match engine.as_mut() {

                      Some(value) => value,

                      None => {
                          return std::ptr::null_mut();
                      }
                  };


              let runtime =
                  match tokio::runtime::Builder::new_current_thread()
                      .enable_all()
                      .build()
                  {

                      Ok(value) => value,

                      Err(_) => {
                          return std::ptr::null_mut();
                      }
                  };


              let result =
                  runtime.block_on(async {

                      let voice =
                          Voice::new("am_michael")
                              .with_speed(speed);


                      tts.synth(
                          &text,
                          voice
                      ).await
                  });


              let (audio, _duration) =
                  match result {

                      Ok(value) => value,

                      Err(_) => {
                          return std::ptr::null_mut();
                      }
                  };


              let mut pcm =
                  Vec::<u8>::with_capacity(
                      audio.len() * 2
                  );


              for sample in audio {

                  let sample =
                      sample.clamp(
                          -1.0,
                          1.0
                      );


                  let value: i16 =
                      if sample >= 0.0 {

                          (sample * 32767.0)
                              as i16

                      } else {

                          (sample * 32768.0)
                              as i16
                      };


                  pcm.extend_from_slice(
                      &value.to_le_bytes()
                  );
              }


              match env.byte_array_from_slice(&pcm) {

                  Ok(array) => {
                      array.into_raw()
                  }

                  Err(_) => {
                      std::ptr::null_mut()
                  }
              }
          }


          #[unsafe(no_mangle)]
          pub extern "system" fn Java_com_vishala_kokoromichael_KokoroEngine_nativeRelease(
              _env: JNIEnv,
              _class: JClass,
          ) {

              if let Ok(mut engine) =
                  ENGINE.lock()
              {
                  *engine = None;
              }
          }
          EOF


          echo ""
          echo "========================================"
          echo "RUST PROJECT CREATED"
          echo "========================================"

          find "$RUST_DIR" \
            -maxdepth 3 \
            -type f \
            -print


      - name: Build Rust JNI library
        shell: bash
        run: |
          set -e

          RUST_DIR="$RUNNER_TEMP/kokoro-rust"

          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"

          echo "========================================"
          echo "ANDROID NDK"
          echo "========================================"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          test -d "$ANDROID_NDK_ROOT"

          echo ""
          echo "NDK directory exists."

          cd "$RUST_DIR"

          echo ""
          echo "========================================"
          echo "BUILDING RUST JNI"
          echo "========================================"

          cargo ndk \
            -t arm64-v8a \
            --platform 29 \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs" \
            build --release

          echo ""
          echo "========================================"
          echo "RUST JNI BUILD COMPLETED"
          echo "========================================"

          find "$GITHUB_WORKSPACE/app/src/main/jniLibs" \
            -maxdepth 4 \
            -type f \
            -print


      - name: Copy Android libc++ shared library
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_NDK_ROOT"

          LIBCXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"

          echo "========================================"
          echo "CHECKING libc++_shared.so"
          echo "========================================"

          test -f "$LIBCXX"

          mkdir -p \
            "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"

          cp \
            "$LIBCXX" \
            "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libc++_shared.so"

          ls -lh \
            "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libc++_shared.so"


      - name: Bundle Kokoro model, Michael voice and G2P lexicon
        shell: bash
        run: |
          set -e

          ASSET_DIR="$GITHUB_WORKSPACE/app/src/main/assets/kokoro"

          mkdir -p "$ASSET_DIR"


          cp \
            "$RUNNER_TEMP/kokoro/kokoro.onnx" \
            "$ASSET_DIR/kokoro.onnx"


          cp \
            "$RUNNER_TEMP/kokoro/am_michael.bin" \
            "$ASSET_DIR/am_michael.bin"


          cp \
            "$RUNNER_TEMP/kokoro-rust/kokoro-g2p.tab" \
            "$ASSET_DIR/kokoro-g2p.tab"


          echo "========================================"
          echo "KOKORO ASSETS"
          echo "========================================"

          ls -lh "$ASSET_DIR"


          test -s \
            "$ASSET_DIR/kokoro.onnx"


          test -s \
            "$ASSET_DIR/am_michael.bin"


          test -s \
            "$ASSET_DIR/kokoro-g2p.tab"


          echo ""
          echo "Model:"
          ls -lh \
            "$ASSET_DIR/kokoro.onnx"


          echo ""
          echo "Michael voice:"
          ls -lh \
            "$ASSET_DIR/am_michael.bin"


          echo ""
          echo "G2P lexicon:"
          cat \
            "$ASSET_DIR/kokoro-g2p.tab"


          echo ""
          echo "All Kokoro assets bundled successfully."


      - name: Verify native libraries and assets
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING NATIVE LIBRARY"
          echo "========================================"

          test -f \
            "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libkokoro_jni.so"

          test -f \
            "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libc++_shared.so"

          echo ""
          echo "========================================"
          echo "VERIFYING KOKORO ASSETS"
          echo "========================================"

          test -s \
            "$GITHUB_WORKSPACE/app/src/main/assets/kokoro/kokoro.onnx"

          test -s \
            "$GITHUB_WORKSPACE/app/src/main/assets/kokoro/am_michael.bin"

          test -s \
            "$GITHUB_WORKSPACE/app/src/main/assets/kokoro/kokoro-g2p.tab"

          echo ""
          echo "Native libraries:"
          ls -lh \
            "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"

          echo ""
          echo "Kokoro assets:"
          ls -lh \
            "$GITHUB_WORKSPACE/app/src/main/assets/kokoro"


      - name: Build release APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILDING RELEASE APK"
          echo "========================================"

          gradle \
            --no-daemon \
            --stacktrace \
            assembleRelease


      - name: Find and prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p \
            "$GITHUB_WORKSPACE/output"


          APK="$(
            find \
              "$GITHUB_WORKSPACE/app/build/outputs/apk/release" \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"


          if [ -z "$APK" ]; then
            echo "ERROR: APK was not found."
            exit 1
          fi


          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file does not exist."
            exit 1
          fi


          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/output/Kokoro-TTS-Michael.apk"


          echo ""
          echo "========================================"
          echo "FINAL APK"
          echo "========================================"

          ls -lh \
            "$GITHUB_WORKSPACE/output/Kokoro-TTS-Michael.apk"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kokoro-TTS-Michael
          path: output/Kokoro-TTS-Michael.apk
          if-no-files-found: error
