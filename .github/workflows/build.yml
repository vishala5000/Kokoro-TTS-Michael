name: Build Kokoro TTS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  KOKORO_VERSION: "0.1.5"
  ANDROID_API: "35"
  ANDROID_NDK_VERSION: "27.2.12479018"
  RUST_VERSION: "stable"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"


      # ============================================================
      # 4. RUST
      # ============================================================

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android


      # ============================================================
      # 5. RUST CACHE
      # ============================================================

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/rust-target
          key: ${{ runner.os }}-cargo-kokoro-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-kokoro-
            ${{ runner.os }}-cargo-


      # ============================================================
      # 6. INSTALL ANDROID RUST TARGET
      # ============================================================

      - name: Add Android Rust target
        run: |
          rustup target add aarch64-linux-android


      # ============================================================
      # 7. ANDROID LINKER
      # ============================================================

      - name: Configure Android linker
        run: |
          NDK="$ANDROID_NDK_HOME"

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "PATH=$TOOLCHAIN:$PATH" >> "$GITHUB_ENV"

          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android35-clang" >> "$GITHUB_ENV"

          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"

          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android35-clang" >> "$GITHUB_ENV"

          echo "CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android35-clang++" >> "$GITHUB_ENV"


      # ============================================================
      # 8. CREATE TEMP RUST PROJECT
      # ============================================================

      - name: Create Rust JNI project
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/kokoro-rust"

          mkdir -p "$RUNNER_TEMP/kokoro-rust/src"

          cp app/src/main/rust/lib.rs \
             "$RUNNER_TEMP/kokoro-rust/src/lib.rs"

          cat > "$RUNNER_TEMP/kokoro-rust/Cargo.toml" <<'EOF'
          [package]
          name = "kokoro_jni"
          version = "1.0.0"
          edition = "2021"

          [lib]
          crate-type = ["cdylib"]

          [profile.release]
          opt-level = 3
          lto = "fat"
          codegen-units = 1
          panic = "abort"
          strip = "symbols"

          [dependencies]
          jni = "0.21"
          tokio = { version = "1.49.0", features = ["rt", "sync", "time"] }

          kokoro-en = {
              version = "0.1.5",
              default-features = true
          }
          EOF

          cd "$RUNNER_TEMP/kokoro-rust"

          cargo generate-lockfile


      # ============================================================
      # 9. DOWNLOAD kokoro-en 0.1.5
      # ============================================================

      - name: Download kokoro-en 0.1.5
        shell: bash
        run: |
          set -e

          cd "$RUNNER_TEMP/kokoro-rust"

          echo "Fetching kokoro-en ${KOKORO_VERSION}..."

          cargo fetch

          echo
          echo "Searching Cargo registry..."
          echo

          find "$HOME/.cargo/registry/src" \
            -maxdepth 3 \
            -type d \
            -name "kokoro-en-${KOKORO_VERSION}" \
            -print


      # ============================================================
      # 10. LOCATE AND COPY REAL kokoro-en SOURCE
      # ============================================================

      - name: Vendor kokoro-en source
        shell: bash
        run: |
          set -e

          SRC="$(find "$HOME/.cargo/registry/src" \
            -maxdepth 3 \
            -type d \
            -name "kokoro-en-${KOKORO_VERSION}" \
            | head -n 1)"

          if [ -z "$SRC" ]; then
            echo "ERROR: kokoro-en ${KOKORO_VERSION} was not found."
            exit 1
          fi

          echo "Found:"
          echo "$SRC"

          rm -rf "$RUNNER_TEMP/kokoro-en-patched"

          cp -a "$SRC" "$RUNNER_TEMP/kokoro-en-patched"

          echo "KOKORO_PATCHED=$RUNNER_TEMP/kokoro-en-patched" >> "$GITHUB_ENV"

          echo
          echo "kokoro-en source:"
          find "$RUNNER_TEMP/kokoro-en-patched/src" \
            -maxdepth 3 \
            -type f \
            -name "*.rs" \
            -print


      # ============================================================
      # 11. INSPECT kokoro-en ORT CODE
      # ============================================================

      - name: Inspect ONNX Runtime session code
        shell: bash
        run: |
          set -e

          echo "Searching for ORT SessionBuilder..."
          echo

          grep -Rni \
            -E "Session::builder|SessionBuilder|commit_from_file|with_intra_threads|with_inter_threads|optimization" \
            "$KOKORO_PATCHED/src" \
            || true


      # ============================================================
      # 12. PATCH kokoro-en FOR CPU
      # ============================================================

      - name: Patch kokoro-en CPU inference
        shell: python3
        run: |
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["KOKORO_PATCHED"])

          print("Patching:", root)

          rust_files = list((root / "src").rglob("*.rs"))

          session_files = []

          for path in rust_files:
              text = path.read_text(encoding="utf-8")

              if (
                  "Session::builder" in text
                  or "commit_from_file" in text
                  or "SessionBuilder" in text
              ):
                  session_files.append(path)

          print("Possible ORT files:")

          for path in session_files:
              print(" -", path)

          if not session_files:
              raise SystemExit(
                  "ERROR: Could not find ONNX Runtime session builder "
                  "inside kokoro-en 0.1.5."
              )

          patched = False

          for path in session_files:

              text = path.read_text(encoding="utf-8")

              # ----------------------------------------------------
              # Case 1:
              #
              # Session::builder()?
              #
              # becomes:
              #
              # Session::builder()?
              #     .with_intra_threads(...)
              #     .with_inter_threads(...)
              #     .with_parallel_execution(...)
              #
              # ----------------------------------------------------

              pattern = r"Session::builder\(\)\?"

              replacement = """Session::builder()?
                  .with_intra_threads(
                      std::thread::available_parallelism()
                          .map(|n| n.get())
                          .unwrap_or(4)
                  )?
                  .with_inter_threads(1)?
                  .with_parallel_execution(false)?"""

              new_text, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1
              )

              if count:
                  path.write_text(new_text, encoding="utf-8")

                  print()
                  print("PATCHED:", path)
                  print("Inserted Android CPU thread configuration.")

                  patched = True
                  break

          if not patched:
              print()
              print(
                  "WARNING: No direct Session::builder() pattern was found."
              )
              print(
                  "The build will continue using kokoro-en's internal "
                  "session configuration."
              )


      # ============================================================
      # 13. SHOW PATCH
      # ============================================================

      - name: Verify patched kokoro-en
        shell: bash
        run: |
          set -e

          echo "================================================"
          echo "Patched kokoro-en source"
          echo "================================================"

          grep -Rni \
            -E "with_intra_threads|with_inter_threads|with_parallel_execution" \
            "$KOKORO_PATCHED/src" \
            || true


      # ============================================================
      # 14. FORCE CARGO TO USE PATCHED CRATE
      # ============================================================

      - name: Configure Cargo patch
        shell: bash
        run: |
          set -e

          cd "$RUNNER_TEMP/kokoro-rust"

          cat >> Cargo.toml <<EOF

          [patch.crates-io]
          kokoro-en = { path = "$KOKORO_PATCHED" }
          EOF

          echo
          echo "Final Cargo.toml:"
          cat Cargo.toml


      # ============================================================
      # 15. FORCE ONNX RUNTIME CPU
      # ============================================================

      - name: Configure Kokoro CPU runtime
        run: |
          echo "KOKORO_ORT_PROVIDER=cpu" >> "$GITHUB_ENV"

          # Do not dynamically oversubscribe the CPU.
          #
          # ORT itself controls the inference threads.
          # The patched kokoro-en session uses:
          #
          # intra-op = available Android CPU cores
          # inter-op = 1
          # parallel execution = false

          echo "OMP_NUM_THREADS=4" >> "$GITHUB_ENV"
          echo "OMP_DYNAMIC=FALSE" >> "$GITHUB_ENV"
          echo "OMP_WAIT_POLICY=ACTIVE" >> "$GITHUB_ENV"


      # ============================================================
      # 16. BUILD RUST JNI
      # ============================================================

      - name: Build Rust JNI ARM64
        shell: bash
        run: |
          set -e

          cd "$RUNNER_TEMP/kokoro-rust"

          export CARGO_BUILD_TARGET=aarch64-linux-android

          cargo build \
            --release \
            --target aarch64-linux-android

          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"

          cp \
            target/aarch64-linux-android/release/libkokoro_jni.so \
            "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libkokoro_jni.so"

          echo
          echo "Native library:"
          ls -lh \
            "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libkokoro_jni.so"


      # ============================================================
      # 17. VERIFY ELF ARCHITECTURE
      # ============================================================

      - name: Verify ARM64 native library
        shell: bash
        run: |
          set -e

          file \
            app/src/main/jniLibs/arm64-v8a/libkokoro_jni.so

          readelf -h \
            app/src/main/jniLibs/arm64-v8a/libkokoro_jni.so \
            | grep -E "Class|Machine"


      # ============================================================
      # 18. BUILD ANDROID APK
      # ============================================================

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease


      # ============================================================
      # 19. FIND APK
      # ============================================================

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "APK files:"
          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      # ============================================================
      # 20. UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kokoro-TTS-Michael-ARM64
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error


      # ============================================================
      # 21. UPLOAD NATIVE LIBRARY FOR DEBUGGING
      # ============================================================

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-jni-arm64
          path: |
            app/src/main/jniLibs/arm64-v8a/libkokoro_jni.so
          if-no-files-found: error
