name: Build Kokoro TTS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  KOKORO_VERSION: "0.1.5"
  ANDROID_API: "35"
  ANDROID_NDK_VERSION: "27.2.12479018"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" \
            >> "$GITHUB_ENV"


      # ============================================================
      # 4. RUST
      # ============================================================

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android


      # ============================================================
      # 5. ANDROID RUST TARGET
      # ============================================================

      - name: Install Android Rust target
        shell: bash
        run: |
          set -e

          rustup target add aarch64-linux-android


      # ============================================================
      # 6. ANDROID LINKER
      # ============================================================

      - name: Configure Android linker
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_NDK_HOME"

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "PATH=$TOOLCHAIN:$PATH" >> "$GITHUB_ENV"

          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android35-clang" \
            >> "$GITHUB_ENV"

          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" \
            >> "$GITHUB_ENV"

          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android35-clang" \
            >> "$GITHUB_ENV"

          echo "CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android35-clang++" \
            >> "$GITHUB_ENV"


      # ============================================================
      # 7. CREATE JNI RUST PROJECT
      # ============================================================

      - name: Create JNI Rust project
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/kokoro-rust"

          mkdir -p "$RUNNER_TEMP/kokoro-rust/src"

          cat > "$RUNNER_TEMP/kokoro-rust/Cargo.toml" <<'EOF'
          [package]
          name = "kokoro_jni"
          version = "1.0.0"
          edition = "2021"

          [lib]
          crate-type = ["cdylib"]

          [profile.release]
          opt-level = 3
          lto = "fat"
          codegen-units = 1
          panic = "abort"
          strip = "symbols"

          [dependencies]
          jni = "0.21"
          tokio = { version = "1.49.0", features = ["rt", "sync", "time"] }

          kokoro-en = {
              version = "0.1.5",
              default-features = true
          }
          EOF


      # ============================================================
      # 8. CREATE JNI SOURCE
      # ============================================================

      - name: Create JNI source
        shell: bash
        run: |
          set -e

          cat > "$RUNNER_TEMP/kokoro-rust/src/lib.rs" <<'EOF'
          use jni::objects::{JClass, JString};
          use jni::sys::jfloat;
          use jni::JNIEnv;

          use std::path::Path;
          use std::sync::{Mutex, OnceLock};

          use kokoro_en::{KokoroTts, Voice};

          static ENGINE: OnceLock<Mutex<Option<KokoroTts>>> = OnceLock::new();

          fn engine() -> &'static Mutex<Option<KokoroTts>> {
              ENGINE.get_or_init(|| Mutex::new(None))
          }

          #[no_mangle]
          pub extern "system" fn Java_com_vishala_kokoromichael_KokoroEngine_nativeInit(
              mut env: JNIEnv,
              _class: JClass,
              model_path: JString,
              voice_path: JString,
          ) -> jni::sys::jboolean {
              let model_path: String = match env.get_string(&model_path) {
                  Ok(value) => value.into(),
                  Err(_) => return 0,
              };

              let voice_path: String = match env.get_string(&voice_path) {
                  Ok(value) => value.into(),
                  Err(_) => return 0,
              };

              let model = Path::new(&model_path);
              let voice = Path::new(&voice_path);

              let result = KokoroTts::new(model, voice);

              match result {
                  Ok(tts) => {
                      if let Ok(mut guard) = engine().lock() {
                          *guard = Some(tts);
                          1
                      } else {
                          0
                      }
                  }

                  Err(_) => 0,
              }
          }

          #[no_mangle]
          pub extern "system" fn Java_com_vishala_kokoromichael_KokoroEngine_nativeSynthesize(
              mut env: JNIEnv,
              _class: JClass,
              text: JString,
              speed: jfloat,
          ) -> jni::sys::jbyteArray {
              let text: String = match env.get_string(&text) {
                  Ok(value) => value.into(),
                  Err(_) => return std::ptr::null_mut(),
              };

              let mut guard = match engine().lock() {
                  Ok(value) => value,
                  Err(_) => return std::ptr::null_mut(),
              };

              let tts = match guard.as_mut() {
                  Some(value) => value,
                  None => return std::ptr::null_mut(),
              };

              let speed = speed as f32;

              let result = tts.synth(&text, speed);

              let audio = match result {
                  Ok(value) => value,
                  Err(_) => return std::ptr::null_mut(),
              };

              match env.byte_array_from_slice(&audio) {
                  Ok(array) => array.into_raw(),
                  Err(_) => std::ptr::null_mut(),
              }
          }

          #[no_mangle]
          pub extern "system" fn Java_com_vishala_kokoromichael_KokoroEngine_nativeRelease(
              _env: JNIEnv,
              _class: JClass,
          ) {
              if let Ok(mut guard) = engine().lock() {
                  *guard = None;
              }
          }
          EOF

          echo "JNI source created:"
          wc -l "$RUNNER_TEMP/kokoro-rust/src/lib.rs"


      # ============================================================
      # 9. CREATE LOCKFILE
      # ============================================================

      - name: Generate Cargo lockfile
        shell: bash
        run: |
          set -e

          cd "$RUNNER_TEMP/kokoro-rust"

          cargo generate-lockfile


      # ============================================================
      # 10. DOWNLOAD KOKORO-EN
      # ============================================================

      - name: Download kokoro-en 0.1.5
        shell: bash
        run: |
          set -e

          cd "$RUNNER_TEMP/kokoro-rust"

          cargo fetch

          echo
          echo "Searching for kokoro-en..."
          echo

          find "$HOME/.cargo/registry/src" \
            -type d \
            -name "kokoro-en-${KOKORO_VERSION}" \
            -print


      # ============================================================
      # 11. LOCATE KOKORO-EN
      # ============================================================

      - name: Locate kokoro-en source
        shell: bash
        run: |
          set -e

          SRC="$(
            find "$HOME/.cargo/registry/src" \
              -type d \
              -name "kokoro-en-${KOKORO_VERSION}" \
              | head -n 1
          )"

          if [ -z "$SRC" ]; then
            echo "ERROR: kokoro-en ${KOKORO_VERSION} not found."
            exit 1
          fi

          echo "Kokoro source:"
          echo "$SRC"

          rm -rf "$RUNNER_TEMP/kokoro-en-patched"

          cp -a "$SRC" "$RUNNER_TEMP/kokoro-en-patched"

          echo "KOKORO_PATCHED=$RUNNER_TEMP/kokoro-en-patched" \
            >> "$GITHUB_ENV"


      # ============================================================
      # 12. SHOW ACTUAL KOKORO SOURCE
      # ============================================================

      - name: Inspect kokoro-en source
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "kokoro-en 0.1.5 source files"
          echo "========================================"

          find "$KOKORO_PATCHED/src" \
            -type f \
            -name "*.rs" \
            -print

          echo
          echo "========================================"
          echo "ORT-related source"
          echo "========================================"

          grep -Rni \
            -E "Session::builder|SessionBuilder|commit_from_file|with_intra_threads|with_inter_threads|ExecutionProvider|GraphOptimization" \
            "$KOKORO_PATCHED/src" \
            || true


      # ============================================================
      # 13. PATCH ONLY IF ACTUAL SOURCE SUPPORTS IT
      # ============================================================

      - name: Patch kokoro-en
        shell: python3
        run: |
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["KOKORO_PATCHED"])

          print("Checking actual kokoro-en 0.1.5 source...")

          found = False

          for path in (root / "src").rglob("*.rs"):
              text = path.read_text(encoding="utf-8")

              if "Session::builder" not in text:
                  continue

              print()
              print("Found Session::builder in:")
              print(path)

              print()
              print("Relevant code:")
              
              for line_number, line in enumerate(
                  text.splitlines(), 1
              ):
                  if "Session::builder" in line:
                      start = max(0, line_number - 5)
                      end = line_number + 10

                      lines = text.splitlines()

                      for i in range(start, min(end, len(lines))):
                          print(
                              f"{i + 1:04d}: {lines[i]}"
                          )

              found = True

          if not found:
              print()
              print(
                  "No Session::builder() was found in the actual "
                  "kokoro-en 0.1.5 source."
              )
              print()
              print(
                  "NO UNSAFE SOURCE PATCH WAS APPLIED."
              )
              print()
              print(
                  "This is intentional: the workflow will not "
                  "pretend that an optimization was applied."
              )


      # ============================================================
      # 14. USE PATCHED CRATE
      # ============================================================

      - name: Configure Cargo patch
        shell: bash
        run: |
          set -e

          cd "$RUNNER_TEMP/kokoro-rust"

          cat >> Cargo.toml <<EOF

          [patch.crates-io]
          kokoro-en = { path = "$KOKORO_PATCHED" }
          EOF

          echo
          echo "Cargo configuration:"
          cat Cargo.toml


      # ============================================================
      # 15. CPU RUNTIME
      # ============================================================

      - name: Configure CPU runtime
        shell: bash
        run: |
          set -e

          echo "KOKORO_ORT_PROVIDER=cpu" >> "$GITHUB_ENV"

          echo "OMP_NUM_THREADS=4" >> "$GITHUB_ENV"

          echo "OMP_DYNAMIC=FALSE" >> "$GITHUB_ENV"


      # ============================================================
      # 16. BUILD ARM64 RUST LIBRARY
      # ============================================================

      - name: Build ARM64 Rust JNI
        shell: bash
        run: |
          set -e

          cd "$RUNNER_TEMP/kokoro-rust"

          cargo build \
            --release \
            --target aarch64-linux-android


      # ============================================================
      # 17. COPY NATIVE LIBRARY
      # ============================================================

      - name: Install native library
        shell: bash
        run: |
          set -e

          mkdir -p \
            "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"

          cp \
            "$RUNNER_TEMP/kokoro-rust/target/aarch64-linux-android/release/libkokoro_jni.so" \
            "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libkokoro_jni.so"

          ls -lh \
            "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libkokoro_jni.so"


      # ============================================================
      # 18. VERIFY ARM64
      # ============================================================

      - name: Verify native library
        shell: bash
        run: |
          set -e

          file \
            app/src/main/jniLibs/arm64-v8a/libkokoro_jni.so

          readelf -h \
            app/src/main/jniLibs/arm64-v8a/libkokoro_jni.so \
            | grep -E "Class|Machine"


      # ============================================================
      # 19. BUILD APK
      # ============================================================

      - name: Build APK
        shell: bash
        run: |
          set -e

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease


      # ============================================================
      # 20. FIND APK
      # ============================================================

      - name: Find APK
        shell: bash
        run: |
          set -e

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      # ============================================================
      # 21. UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kokoro-TTS-Michael-ARM64
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error


      # ============================================================
      # 22. UPLOAD NATIVE LIBRARY
      # ============================================================

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: Kokoro-JNI-ARM64
          path: app/src/main/jniLibs/arm64-v8a/libkokoro_jni.so
          if-no-files-found: error
